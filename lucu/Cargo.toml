[package]
name = "lucu"
version = "0.1.0"
edition = "2024"

[dependencies]
compact_str = "0.9.0"
do-notation = "0.1.3"
im = "15.1.0"
lasso = "0.7.3"
path-clean = "1.0.1"
petgraph = { git = "https://github.com/astavie/petgraph.git", rev = "c9d1b2a5f3968ab37c3b32cd02fc1f244be7f22b", default-features = false, features = ["std"] }
strum = { version = "0.27.2", features = ["derive"] }
indexmap = "2.13.0"
itertools = "0.14.0"

include_dir = { workspace = true, optional = true }
crossbeam-channel = { version = "0.5.15", optional = true }
notify-debouncer-full = { version = "0.6.0", features = ["crossbeam-channel"], optional = true }

lucu-annotate = { path = "../lucu-annotate", optional = true }
anstyle = { workspace = true, optional = true }

anstream = { version = "0.6.21", optional = true }
line-column = { version = "0.2.0", optional = true }

[features]
watcher = ["dep:include_dir", "dep:crossbeam-channel", "dep:notify-debouncer-full"]
annotate = ["dep:lucu-annotate", "lucu-annotate/anstyle", "dep:anstyle"]
print = ["annotate", "dep:anstream", "dep:line-column"]
