[workspace]
resolver = "3"
members = [
  # packages using a unified version
  "lucu",
  "lucu-llvm",
  "lucu-cli",
  "lucu-fmt",
  "lucu-lsp",
  "mu",
  "mu-llvm",
  # libraries using their own versioning scheme
  "asta-annotate",
  "asta-pretty",
  "asta-handle-map",
]

[workspace.package]
version = "0.2.0"

[workspace.dependencies]
inkwell = { version = "0.9.0", features = ["llvm21-1"] }
compact_str = "0.9.0"
anstyle = { version = "1.0.13", default-features = false }
include_dir = "0.7.4"

[workspace.lints.clippy]
# UM, ACTUALLY
pedantic = { level = "warn", priority = -1 }
# DEVELOPING LINTS
nursery = { level = "warn", priority = -1 }
# DENY PANICS
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
unreachable = "warn"
unimplemented = "warn"
unchecked_time_subtraction = "warn"
todo = "warn"
string_slice = "warn"
panic_in_result_fn = "warn"
panic = "warn"
exit = "warn"
# as_conversions = "warn"
