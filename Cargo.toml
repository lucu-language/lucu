[workspace]
resolver = "3"
members = [
  # packages using a unified version
  "lucu",
  "lucu-llvm",
  "lucu-cli",
  "lucu-fmt",
  "lucu-lsp",
  "mu",
  "mu-llvm",
  # libraries using their own versioning scheme
  "asta-annotate",
  "asta-pretty",
  "asta-handle-map",
]

[workspace.package]
version = "0.2.0"

[workspace.dependencies]
inkwell = { version = "0.9.0", features = ["llvm21-1"] }
compact_str = "0.9.0"
anstyle = { version = "1.0.13", default-features = false }
include_dir = "0.7.4"

[workspace.lints.clippy]
# UM, ACTUALLY
pedantic = { level = "deny", priority = -1 }
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
disallowed_macros = "deny"
# ALLOW PEDANTIC STUFF I DON'T CARE ABOUT
missing_errors_doc = "allow"
too_many_lines = "allow"
